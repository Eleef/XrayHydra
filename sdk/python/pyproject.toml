[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xray-prism-sdk"
version = "0.1.0"
description = "Python SDK for the Xray-Prism OpenAPI contract"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]

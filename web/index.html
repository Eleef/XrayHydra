<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Xray-Prism - 多节点代理端口管理器，将VPN订阅中的每个节点映射为本地独立端口">
    <title>Xray-Prism | 多节点代理管理器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-left">
                <div class="logo">
                    <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
                    </svg>
                    <h1 class="logo-text">Xray-Prism</h1>
                </div>
            </div>
            <div class="header-right">
                <div class="xray-status" id="xray-status">
                    <span class="status-dot stopped"></span>
                    <span class="status-text">已停止</span>
                </div>
                <button class="btn btn-icon" id="btn-toggle-xray" title="启动/停止 Xray">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polygon points="10 8 16 12 10 16 10 8" fill="currentColor"></polygon>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Sidebar - Subscriptions -->
            <aside class="sidebar">
                <div class="section-header">
                    <h2 class="section-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                        </svg>
                        订阅管理
                    </h2>
                    <button class="btn btn-primary btn-sm" id="btn-add-subscription">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        添加
                    </button>
                </div>
                <div class="subscription-list" id="subscription-list">
                    <div class="loading-placeholder">
                        <div class="spinner"></div>
                        <span>加载中...</span>
                    </div>
                </div>
            </aside>

            <!-- Main Panel -->
            <div class="main-panel">
                <!-- Nodes Panel -->
                <div class="panel nodes-panel">
                    <div class="section-header">
                        <h2 class="section-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="7" height="7"></rect>
                                <rect x="14" y="3" width="7" height="7"></rect>
                                <rect x="14" y="14" width="7" height="7"></rect>
                                <rect x="3" y="14" width="7" height="7"></rect>
                            </svg>
                            节点列表
                            <span class="badge" id="nodes-count">0</span>
                        </h2>
                        <div class="section-actions">
                            <div class="search-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8"></circle>
                                    <path d="m21 21-4.35-4.35"></path>
                                </svg>
                                <input type="text" id="node-search" placeholder="搜索节点...">
                            </div>
                            <button class="btn btn-secondary btn-sm" id="btn-select-all">
                                全选
                            </button>
                            <button class="btn btn-primary btn-sm" id="btn-add-to-proxy" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M5 12h14"></path>
                                    <path d="m12 5 7 7-7 7"></path>
                                </svg>
                                添加到代理
                            </button>
                        </div>
                    </div>
                    <div class="nodes-container" id="nodes-container">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p>请先从左侧选择一个订阅</p>
                        </div>
                    </div>
                </div>

                <!-- Proxies Panel -->
                <div class="panel proxies-panel">
                    <div class="section-header">
                        <h2 class="section-title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 12h-4l-3 9L9 3l-3 9H2"></path>
                            </svg>
                            活跃代理
                            <span class="badge badge-success" id="proxies-count">0</span>
                        </h2>
                        <div class="section-actions">
                            <button class="btn btn-secondary btn-sm" id="btn-test-all" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                                    <polyline points="22 4 12 14.01 9 11.01"></polyline>
                                </svg>
                                测试全部
                            </button>
                            <button class="btn btn-danger btn-sm" id="btn-clear-proxies" disabled>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                清空
                            </button>
                        </div>
                    </div>
                    <div class="proxies-container" id="proxies-container">
                        <div class="empty-state">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z"></path>
                            </svg>
                            <p>暂无活跃代理</p>
                            <span class="hint">从节点列表中选择节点并添加到代理</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Add Subscription -->
    <div class="modal-overlay" id="modal-add-subscription">
        <div class="modal">
            <div class="modal-header">
                <h3>添加订阅</h3>
                <button class="btn-close" data-close-modal>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="sub-name">订阅名称</label>
                    <input type="text" id="sub-name" placeholder="例如：我的机场" required>
                </div>
                <div class="form-group">
                    <label for="sub-url">订阅链接</label>
                    <input type="url" id="sub-url" placeholder="https://..." required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal>取消</button>
                <button class="btn btn-primary" id="btn-confirm-add">
                    <span class="btn-text">添加订阅</span>
                    <span class="btn-loading hidden">
                        <div class="spinner-sm"></div>
                    </span>
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
